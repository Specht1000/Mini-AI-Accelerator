  <text x="225" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3b73">CPU = 4 experienced chefs</text>
  <text x="655" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d6b3a">GPU = 1000 kitchen assistants</text>
