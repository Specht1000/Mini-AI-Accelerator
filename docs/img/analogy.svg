    <circle cx="105" cy="95" r="22"/><circle cx="185" cy="95" r="22"/><circle cx="265" cy="95" r="22"/><circle cx="345" cy="95" r="22"/>
    <rect x="83" y="120" width="44" height="30" rx="8"/><rect x="163" y="120" width="44" height="30" rx="8"/><rect x="243" y="120" width="44" height="30" rx="8"/><rect x="323" y="120" width="44" height="30" rx="8"/>
