  <text x="225" y="185" text-anchor="middle" font-size="14">They handle any dish, even complex ones.</text>
  <text x="225" y="207" text-anchor="middle" font-size="14">A special order? One chef handles it quickly.</text>
  <text x="655" y="180" text-anchor="middle" font-size="14">Each worker performs a simple task.</text>
  <text x="655" y="202" text-anchor="middle" font-size="14">10,000 potatoes to cut? They finish sooner.</text>
  <text x="655" y="226" text-anchor="middle" font-size="12" fill="#666">Transport takes time: this is data transfer.</text>
