<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="400" viewBox="0 0 860 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="400" fill="#ffffff"/>
  <defs>
    <g id="grid" fill="#3aa35f">
      <rect x="0" y="0" width="9" height="9"/><rect x="12" y="0" width="9" height="9"/><rect x="24" y="0" width="9" height="9"/><rect x="36" y="0" width="9" height="9"/><rect x="48" y="0" width="9" height="9"/><rect x="60" y="0" width="9" height="9"/>
      <rect x="0" y="12" width="9" height="9"/><rect x="12" y="12" width="9" height="9"/><rect x="24" y="12" width="9" height="9"/><rect x="36" y="12" width="9" height="9"/><rect x="48" y="12" width="9" height="9"/><rect x="60" y="12" width="9" height="9"/>
      <rect x="0" y="24" width="9" height="9"/><rect x="12" y="24" width="9" height="9"/><rect x="24" y="24" width="9" height="9"/><rect x="36" y="24" width="9" height="9"/><rect x="48" y="24" width="9" height="9"/><rect x="60" y="24" width="9" height="9"/>
      <rect x="0" y="36" width="9" height="9"/><rect x="12" y="36" width="9" height="9"/><rect x="24" y="36" width="9" height="9"/><rect x="36" y="36" width="9" height="9"/><rect x="48" y="36" width="9" height="9"/><rect x="60" y="36" width="9" height="9"/>
    </g>
  </defs>

  <text x="215" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3b73">CPU</text>
  <text x="215" y="56" text-anchor="middle" font-size="13" fill="#555">a few large, versatile cores</text>
  <rect x="40" y="70" width="350" height="250" rx="10" fill="#eef3fb" stroke="#1f3b73" stroke-width="2"/>
  <g fill="#3d6fc4" stroke="#1f3b73">
    <rect x="60" y="90" width="145" height="80" rx="6"/><rect x="225" y="90" width="145" height="80" rx="6"/>
    <rect x="60" y="185" width="145" height="80" rx="6"/><rect x="225" y="185" width="145" height="80" rx="6"/>
  </g>
  <g font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <text x="132" y="135">Core</text><text x="297" y="135">Core</text>
    <text x="132" y="230">Core</text><text x="297" y="230">Core</text>
  </g>
  <rect x="60" y="278" width="310" height="30" rx="5" fill="#f2b84b"/>
  <text x="215" y="298" text-anchor="middle" font-size="13">Large cache (fast memory near cores)</text>
  <text x="215" y="350" text-anchor="middle" font-size="13" fill="#333">Effective at sequential work with branches (if/else),</text>
  <text x="215" y="370" text-anchor="middle" font-size="13" fill="#333">and low latency for an individual task.</text>

  <text x="645" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d6b3a">GPU</text>
  <text x="645" y="56" text-anchor="middle" font-size="13" fill="#555">many small, simple execution units</text>
  <rect x="470" y="70" width="350" height="250" rx="10" fill="#edf8f0" stroke="#1d6b3a" stroke-width="2"/>
  <use xlink:href="#grid" x="485" y="85"/><use xlink:href="#grid" x="567" y="85"/><use xlink:href="#grid" x="649" y="85"/><use xlink:href="#grid" x="731" y="85"/>
  <use xlink:href="#grid" x="485" y="147"/><use xlink:href="#grid" x="567" y="147"/><use xlink:href="#grid" x="649" y="147"/><use xlink:href="#grid" x="731" y="147"/>
  <use xlink:href="#grid" x="485" y="209"/><use xlink:href="#grid" x="567" y="209"/><use xlink:href="#grid" x="649" y="209"/><use xlink:href="#grid" x="731" y="209"/>
  <rect x="490" y="278" width="310" height="30" rx="5" fill="#f2b84b"/>
  <text x="645" y="298" text-anchor="middle" font-size="13">Dedicated memory (VRAM), separate from CPU</text>
  <text x="645" y="350" text-anchor="middle" font-size="13" fill="#333">Effective when the SAME operation repeats</text>
  <text x="645" y="370" text-anchor="middle" font-size="13" fill="#333">thousands of times on different data.</text>
</svg>
